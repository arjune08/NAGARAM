name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-check:
    name: Python compatibility check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Verify Supabase configuration files
        run: |
          test -f supabase/README.md
          ! grep -R "service_role\|sb_secret_" .env.example supabase 2>/dev/null
