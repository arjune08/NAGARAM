<header class="top-navbar">
  <div class="navbar-progress" id="navProgress"></div>
  <div class="navbar-left">
    <button class="mobile-nav-toggle" id="sidebarToggle" type="button" aria-label="Open navigation" aria-controls="appSidebar" aria-expanded="false"><i data-lucide="menu"></i></button>
    <div class="breadcrumb"><i data-lucide="route" style="width:14px;height:14px;color:var(--accent);"></i><span class="breadcrumb-sep">/</span><span class="breadcrumb-current">{% block page_title %}Dashboard{% endblock %}</span></div>
    <div class="system-pulse"><div class="status-dot live"></div><span>Action network active</span></div>
  </div>
  <div class="navbar-right">
    <button class="btn-icon" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle color theme"><i data-lucide="moon" id="themeIcon"></i></button>
    <button class="btn-icon" title="Notifications" aria-label="Notifications" style="position:relative;" onclick="showToast('No new notifications', 'info')"><i data-lucide="bell"></i>{% if unread_notifications > 0 %}<span style="position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--rose);border-radius:50%;border:2px solid var(--bg-secondary);"></span>{% endif %}</button>
    <a href="{{ url_for('safety.center') }}" class="btn btn-danger btn-sm header-sos"><i data-lucide="shield-alert"></i><span>SOS</span></a>
    <div class="header-user"><div class="user-avatar" style="width:30px;height:30px;font-size:.75rem;">{{ current_user.full_name[:1].upper() }}</div><div class="header-user-copy"><div>{{ current_user.full_name.split()[0] }}</div><small>{{ current_user.role }}</small></div></div>
  </div>
</header>
