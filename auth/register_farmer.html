{% extends 'base.html' %}{% block title %}Create Farmer Account — NAGARAM{% endblock %}{% block public_content %}<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 20%,rgba(151,184,91,.15),transparent 28%),#08110d"><section style="width:min(720px,100%);padding:2rem;border:1px solid rgba(183,209,122,.25);border-radius:24px;background:#101b17"><div style="color:#b7d17a;font-size:.75rem;font-weight:800;letter-spacing:.12em">NAGARAM / AGRI-NAGARAM</div><h1>Create your Farmer Workspace</h1><p style="color:#9eada3">One NAGARAM account, with a dedicated farm intelligence workspace.</p><form method="post" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input name="full_name" placeholder="Full name" required><input name="phone" placeholder="Mobile number"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (min 6 characters)" required><input name="village" placeholder="Village" required><input name="district" placeholder="District"><select name="language"><option value="en">English</option><option value="ta">தமிழ் / Tamil</option><option value="hi">हिन्दी / Hindi</option></select><button type="submit">Create Farmer Account</button></form><p style="color:#9eada3;margin-top:1rem">Already registered? <a href="{{ url_for('auth.login') }}" style="color:#c5dc76">Sign in</a></p></section></main><style>input,select,button{padding:13px;border-radius:10px;border:1px solid #33463a;background:#0c1510;color:#fff}button{background:#c5dc76;color:#142114;font-weight:900;border:0;cursor:pointer}@media(max-width:600px){form{grid-template-columns:1fr!important}}</style>{% endblock %}
