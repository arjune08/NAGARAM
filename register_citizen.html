{% extends 'base.html' %}

{% block title %}Citizen Registration - UrbanPulse AI{% endblock %}

{% block public_content %}
<div class="flex items-center justify-center" style="min-height: 100vh; padding: 2rem; background: var(--bg-primary);">
  <div class="glass-card" style="width: 100%; max-width: 480px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem; margin: 0 auto 0.75rem;">U</div>
      <h2>Register as a Citizen</h2>
      <p style="font-size: 0.9rem;">Report civic issues, track resolution, and access emergency services</p>
    </div>

    <form action="{{ url_for('auth.register_citizen') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 019-2831">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
        Create Citizen Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;" class="text-muted">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
