{% extends 'base.html' %}

{% block title %}NGO Registration - UrbanPulse AI{% endblock %}

{% block public_content %}
<div class="flex items-center justify-center" style="min-height: 100vh; padding: 2rem; background: var(--bg-primary);">
  <div class="glass-card" style="width: 100%; max-width: 520px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="width: 44px; height: 44px; font-size: 1.5rem; margin: 0 auto 0.75rem;">U</div>
      <h2>Register NGO Organization</h2>
      <p style="font-size: 0.9rem;">Lead community resilience initiatives & manage volunteer drives</p>
    </div>

    <form action="{{ url_for('auth.register_ngo') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Representative Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Dr. Alex Rivera" required>
      </div>

      <div class="form-group">
        <label class="form-label">Organization Name</label>
        <input type="text" name="org_name" class="form-control" placeholder="Urban Resilience Alliance" required>
      </div>

      <div class="form-group">
        <label class="form-label">Registration / Tax ID</label>
        <input type="text" name="reg_number" class="form-control" placeholder="NGO-2026-9901" required>
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
          <option value="Environment & Sustainability">Environment & Sustainability</option>
          <option value="Disaster Relief">Disaster Relief</option>
          <option value="Community Care & Health">Community Care & Health</option>
          <option value="Sanitation & Cleanliness">Sanitation & Cleanliness</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="contact@ngo.org" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
        Register NGO Organization
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;" class="text-muted">
      Already registered? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
